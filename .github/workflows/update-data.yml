name: Update PvPoke data

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download and trim
        run: python3 scripts/update_data.py

      # Icons for newly ranked Pokémon or changed upstream icons; unchanged ones are not re-downloaded.
      - name: Update Pokémon images
        run: |
          pip install --quiet pillow
          python3 scripts/update_images.py

      # A PvPoke change that breaks the engine must not reach the live site.
      - name: Engine tests against the new data
        run: node scripts/run-tests.js

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data img)" ]; then
            echo "Data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data img
          git commit -m "Update PvPoke data snapshot"
          git push
